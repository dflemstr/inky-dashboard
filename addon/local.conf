<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Disable font anti-aliasing so text renders pure black/white (1-bit) for the
     e-ink panel: AA'd gray edges otherwise get dithered into speckle on the
     limited Spectra palette. Full hinting snaps stems to the pixel grid. -->
<fontconfig>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
