[project]
name = "inky-dashboard"
version = "0.1.0"
description = "Render web pages to Pimoroni Inky E-Ink displays"
readme = "README.md"
authors = [{ name = "David Flemström", email = "david.flemstrom@gmail.com" }]
requires-python = ">=3.11"
# Base install is tiny. Pick the side you need:
#   serve   — the rendering half (browser); runs on a capable host / HA add-on
#   display — the panel half (inky); runs on the Raspberry Pi (no browser)
dependencies = [
    "pillow>=12.3.0",
]

[project.optional-dependencies]
# serve: the rendering half (browser + HTTP server) — runs on a capable host
serve = [
    "playwright>=1.61.0",
    "aiohttp>=3.9",
]
# display: the panel half (inky) — runs on the Raspberry Pi, no browser
display = [
    "inky>=2.4.0",
]
# local: all-in-one on one host (browser + panel, no HTTP server)
local = [
    "playwright>=1.61.0",
    "inky>=2.4.0",
]

[project.scripts]
inky-dashboard = "inky_dashboard.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
